<!DOCTYPE html>

<html>
    <head>
        <title>Gengar</title>
        <link rel="icon" type="image/x-icon" href="/images/gengar.jpg" />

        <!-- stylesheets -->
        <link rel="stylesheet" href="style/scrollbar.css" />
        <link rel="stylesheet" href="style/buttons.css" />
        <link rel="stylesheet" href="style/footer.css" />
        <link rel="stylesheet" href="style/main.css" />
        <link rel="stylesheet" href="style/nav.css" />
    </head>

    <body>
        <div class="main">
            <nav>
                <div class="container">
                    <img class="nav_pfp" src="/images/gengar.jpg" alt="gengarbot" />
                    <h1 class="logo">Gengar</h1>

                    <div class="menu">
                        <a
                            href="https://discord.com/api/oauth2/authorize?client_id=978607530362163201&permissions=8&scope=bot%20applications.commands"
                            target="_blank"
                            >Invite</a
                        >
                        <a href="#discord">Support</a>
                        <a href="#about">About</a>
                        <a class="is-active" href="#">Home</a>
                    </div>

                    <button class="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </nav>

            <div class="gengar">
                <img class="gengarpfp" src="/images/gengar.jpg" alt="gengarbot" />
                <h2 class="geng_text">GENGAR-BOT</h2>
                <a
                    href="https://discord.com/api/oauth2/authorize?client_id=978607530362163201&permissions=8&scope=bot%20applications.commands"
                    target="_blank"
                >
                    <button class="invite">Invite Me</button>
                </a>
            </div>
        </div>

        <section id="about">
        </section>

        <section id="discord" class="discord">
            <div class="section">
                <p class="discord_title">Discord</p>

                <div class="widget">
                    <iframe
                        src="https://discord.com/widget?id=947121013655748618&theme=dark"
                        width="350"
                        height="500"
                        allowtransparency="true"
                        frameborder="0"
                        sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
                    ></iframe>
                </div>

                <a href="https://discord.gg/urj2yRH2W7" target="_blank">
                    <button class="discord_invite">Discord Server</button>
                </a>
            </div>
        </section>

        <footer>
            <div class="footer">
                <span>
                    All Rights Reserved 2022
                    <a href="https://discord.com/terms" target="_blank">&copy;</a>
                </span>
            </div>
        </footer>
    </body>
</html>
